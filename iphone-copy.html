<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>クロッピー iPhone版 v2.58.27</title><style>body{margin:0;background:#17212b;color:#f5f8fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;line-height:1.6}main{max-width:580px;margin:auto}h1{font-size:1.5rem}p{font-size:1.1rem}.card{background:#24313d;border:1px solid #526a7d;border-radius:18px;padding:20px;margin:20px 0}button,a.link{display:block;width:100%;box-sizing:border-box;text-align:center;background:#2563eb;color:white;border:0;border-radius:14px;padding:18px;font-size:1.2rem;font-weight:800;text-decoration:none;margin:12px 0}button:disabled{opacity:.5}.secondary{background:#334155!important}#status{color:#a7f3d0;min-height:2em}textarea{width:100%;height:180px;box-sizing:border-box;background:#0d1622;color:#fff;border:1px solid #526a7d;border-radius:12px;padding:12px;font-size:14px}</style></head><body><main><h1>クロッピー iPhone版 v2.58.27</h1><div class="card"><p>①「全文をコピー」を押す</p><p>② Scriptableでクロッピーを開き、古いコードを全選択して貼り付ける</p><button id="copy" disabled>読み込み中…</button><p id="status">ファイルを準備しています</p></div><div class="card"><p>コピーできない場合は、下の欄を長押しして「すべて選択」→「コピー」。</p><textarea id="source" readonly spellcheck="false"></textarea><a class="link secondary" href="./CROPPY_iPhone_v2.58.27.js" download>ファイルを直接保存</a></div></main><script>let code='';const btn=document.getElementById('copy'),status=document.getElementById('status'),box=document.getElementById('source');fetch('./CROPPY_iPhone_v2.58.27.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(t=>{if(!t.includes('v2.58.27')||!t.includes('Script.complete()'))throw Error('内容の確認に失敗');code=t;box.value=t;btn.disabled=false;btn.textContent='全文をコピー';status.textContent='準備完了（'+t.length.toLocaleString()+'文字）'}).catch(e=>{status.textContent='読み込めませんでした。ページを再読み込みしてください。 '+e.message});btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code);status.textContent='コピーしました。Scriptableに貼り付けてください。'}catch(e){box.focus();box.select();const ok=document.execCommand('copy');status.textContent=ok?'コピーしました。Scriptableに貼り付けてください。':'下の欄を長押しして「すべて選択」→「コピー」してください。'}})</script></body></html>
