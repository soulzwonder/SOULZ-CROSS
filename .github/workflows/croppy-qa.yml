name: CROPPY QA and Packages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ChatGPTなどから短時間に複数ファイルを順番に更新した場合、
# 途中commitのQAを打ち切り、最後のpushだけを検証する。
concurrency:
  group: croppy-qa-main
  cancel-in-progress: true

jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - name: Debounce rapid pushes
        if: github.event_name == 'push'
        run: sleep 45
      - uses: actions/checkout@v4
      - name: Regression and behavior QA
        run: node qa_stage4.js
      - name: API server smoke test
        run: |
          node server.js > /tmp/croppy-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -fsS http://127.0.0.1:10000/health | grep -q '^ok$'; then exit 0; fi
          done
          cat /tmp/croppy-server.log
          exit 1
      - name: iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: CROPPY_iPhone_v2.63.21_QUICK_JUMP
          path: |
            CROPPY_iPhone_v2.63.21.js
            QA_REPORT.txt
          if-no-files-found: error
          retention-days: 30
      - name: Android-Web package
        uses: actions/upload-artifact@v4
        with:
          name: CROPPY_Android_Web_v2.63.21_QUICK_JUMP
          path: |
            index.html
            manifest.webmanifest
            sw.js
            server.js
            icon-192.png
            icon-512.png
            QA_REPORT.txt
          if-no-files-found: error
          retention-days: 30
